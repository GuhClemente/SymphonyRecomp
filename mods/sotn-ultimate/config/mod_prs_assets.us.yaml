# Saturn port mod: assets of the Cursed Prison (mods/sotn-ultimate/tools/build_prs.sh). The
# target is only used for extraction; the stage data comes from
# mods/sotn-ultimate/tools/prs_assets.py.
version: us
files:
  - target: disks/us/ST/WRP/WRP.BIN
    asset_path: assets/st/prs
    src_path: mods/sotn-ultimate/src/prison/prs
    splat_config_path: config/splat.us.stwrp.yaml
    segments:
      - start: 0
        vram: 0x80180000
        assets:
          - [0x40, sprite_banks, us/sprite_banks]
          - [0xA0, paldef, palette_def]
          - [0xB8, layers, layers]
          - [0x1B8, gfx_banks, graphics_banks]
          - [0x23C, layout, entity_layouts]
          - [0x3E4, skip]
          - [0x11AC, rooms, rooms]
          - [0x1228, skip]
          - [0x1420, cmpgfx, stage_title_wrp_jp, 128, 128, 4]
          - [0x1764, cmpgfx, stage_placeholder_wrp, 128, 128, 4]
          - [0x1D08, palette, D_80181D08, 16] # 0x200
          - [0x1D68, skip] # tile data
          - [0x2968, skip] # tile definitions
          - [0x6D88, skip] # sprites
